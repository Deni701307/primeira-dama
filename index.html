<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f2ec">
  <title>Primeira Dama</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f2ec;
      color: #332d2a;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      padding: 24px 18px 40px;
    }

    .topo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .marca {
      font-size: 14px;
      letter-spacing: 2px;
      font-weight: bold;
      color: #8c625b;
    }

    .perfil {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #e6d5cc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .saudacao {
      margin-bottom: 28px;
    }

    .saudacao small {
      color: #8a817c;
      font-size: 14px;
    }

    .saudacao h1 {
      margin: 5px 0 0;
      font-size: 29px;
      font-weight: 600;
    }

    .calendario {
      background: white;
      border-radius: 26px;
      padding: 22px 18px;
      box-shadow: 0 8px 30px rgba(70, 50, 40, 0.08);
    }

    .mes {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .mes button {
      border: 0;
      background: #f4ece7;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 20px;
      color: #5c4a44;
    }

    .mes h2 {
      margin: 0;
      font-size: 19px;
    }

    .semana,
    .dias {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 7px;
      text-align: center;
    }

    .semana {
      color: #9a8e88;
      font-size: 12px;
      margin-bottom: 9px;
    }

    .dia {
      aspect-ratio: 1;
      border: 0;
      background: transparent;
      border-radius: 50%;
      font-size: 14px;
      color: #403936;
      position: relative;
    }

    .dia:hover {
      background: #f4ece7;
    }

    .dia.hoje {
      background: #8c625b;
      color: white;
      font-weight: bold;
    }

    .dia.memoria::after {
      content: "";
      width: 5px;
      height: 5px;
      background: #c99983;
      border-radius: 50%;
      position: absolute;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);
    }

    .legenda {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 18px;
      color: #8a817c;
      font-size: 12px;
    }

    .bolinha {
      width: 7px;
      height: 7px;
      background: #c99983;
      border-radius: 50%;
    }

    .acoes {
      margin-top: 22px;
    }

    .nova-capsula {
      width: 100%;
      border: 0;
      border-radius: 18px;
      background: #5e4943;
      color: white;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
    }

    .frase {
      text-align: center;
      color: #91857f;
      font-size: 13px;
      line-height: 1.5;
      margin: 26px 20px 0;
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="topo">
      <div class="marca">PRIMEIRA DAMA</div>
      <div class="perfil">♡</div>
    </header>

    <section class="saudacao">
      <small>Suas histórias vivem aqui</small>
      <h1>Memórias que ficam.</h1>
    </section>

    <section class="calendario">

      <div class="mes">
        <button aria-label="Mês anterior">‹</button>
        <h2>Setembro 2026</h2>
        <button aria-label="Próximo mês">›</button>
      </div>

      <div class="semana">
        <span>D</span>
        <span>S</span>
        <span>T</span>
        <span>Q</span>
        <span>Q</span>
        <span>S</span>
        <span>S</span>
      </div>

      <div class="dias">
        <span></span>
        <span></span>

        <button class="dia">1</button>
        <button class="dia">2</button>
        <button class="dia">3</button>
        <button class="dia">4</button>
        <button class="dia">5</button>

        <button class="dia">6</button>
        <button class="dia">7</button>
        <button class="dia memoria">8</button>
        <button class="dia">9</button>
        <button class="dia">10</button>
        <button class="dia memoria">11</button>
        <button class="dia">12</button>

        <button class="dia">13</button>
        <button class="dia">14</button>
        <button class="dia">15</button>
        <button class="dia">16</button>
        <button class="dia memoria">17</button>
        <button class="dia">18</button>
        <button class="dia">19</button>

        <button class="dia">20</button>
        <button class="dia">21</button>
        <button class="dia">22</button>
        <button class="dia">23</button>
        <button class="dia">24</button>
        <button class="dia hoje">25</button>
        <button class="dia">26</button>

        <button class="dia">27</button>
        <button class="dia">28</button>
        <button class="dia">29</button>
        <button class="dia">30</button>
      </div>

      <div class="legenda">
        <span class="bolinha"></span>
        <span>Este dia guarda uma memória</span>
      </div>

    </section>

    <div class="acoes">
      <button class="nova-capsula">＋ Criar nova cápsula</button>
    </div>

    <p class="frase">
      Fotos, vídeos, áudios e palavras.<br>
      Guarde hoje para reviver amanhã.
    </p>

  </main>

<script>
  const nomesMeses = [
    "Janeiro", "Fevereiro", "Março", "Abril",
    "Maio", "Junho", "Julho", "Agosto",
    "Setembro", "Outubro", "Novembro", "Dezembro"
  ];

  let mesAtual = 8;
  let anoAtual = 2026;

  const tituloMes = document.querySelector(".mes h2");
  const areaDias = document.querySelector(".dias");
  const botoesMes = document.querySelectorAll(".mes button");

  function montarCalendario() {
    tituloMes.textContent = `${nomesMeses[mesAtual]} ${anoAtual}`;
    areaDias.innerHTML = "";

    const primeiroDia = new Date(anoAtual, mesAtual, 1).getDay();
    const quantidadeDias = new Date(anoAtual, mesAtual + 1, 0).getDate();

    for (let i = 0; i < primeiroDia; i++) {
      const vazio = document.createElement("span");
      areaDias.appendChild(vazio);
    }

    for (let dia = 1; dia <= quantidadeDias; dia++) {
      const botao = document.createElement("button");
      botao.className = "dia";
      botao.textContent = dia;

      if (
        dia === 25 &&
        mesAtual === 8 &&
        anoAtual === 2026
      ) {
        botao.classList.add("hoje");
      }

      if (
        mesAtual === 8 &&
        anoAtual === 2026 &&
        [8, 11, 17].includes(dia)
      ) {
        botao.classList.add("memoria");
      }

      let tempoPressionado;
let toqueLongo = false;

function iniciarToqueLongo() {
  toqueLongo = false;

  tempoPressionado = setTimeout(() => {
    toqueLongo = true;

    botao.style.outline = "3px solid #c99983";
    botao.style.outlineOffset = "4px";

    if (navigator.vibrate) {
      navigator.vibrate(80);
    }

    const cachorroAntigo = document.querySelector(".cachorro-memoria");

if (cachorroAntigo) {
  cachorroAntigo.remove();
}

const cachorro = document.createElement("div");
cachorro.className = "cachorro-memoria";

cachorro.innerHTML = `
  <div style="
    font-size:58px;
    text-align:center;
  ">🐶</div>

  <div style="
    background:white;
    padding:10px 16px;
    border-radius:18px;
    margin-top:6px;
    box-shadow:0 6px 20px rgba(0,0,0,.12);
    font-size:14px;
    white-space:nowrap;
  ">
    Buscando sua memória... 🐾
  </div>
`;

cachorro.style.position = "fixed";
cachorro.style.left = "-140px";
cachorro.style.bottom = "90px";
cachorro.style.zIndex = "9999";
cachorro.style.transition = "left 1.8s ease-in-out";
cachorro.style.pointerEvents = "none";

document.body.appendChild(cachorro);

setTimeout(() => {
  cachorro.style.left = "50%";
  cachorro.style.transform = "translateX(-50%)";
}, 50);

setTimeout(() => {
  cachorro.remove();
}, 3000);
  }, 700);
}

function cancelarToqueLongo() {
  clearTimeout(tempoPressionado);
}

botao.addEventListener("pointerdown", iniciarToqueLongo);
botao.addEventListener("pointerup", cancelarToqueLongo);
botao.addEventListener("pointerleave", cancelarToqueLongo);
botao.addEventListener("pointercancel", cancelarToqueLongo);

      areaDias.appendChild(botao);
    }
  }

  botoesMes[0].addEventListener("click", () => {
    mesAtual--;

    if (mesAtual < 0) {
      mesAtual = 11;
      anoAtual--;
    }

    montarCalendario();
  });

  botoesMes[1].addEventListener("click", () => {
    mesAtual++;

    if (mesAtual > 11) {
      mesAtual = 0;
      anoAtual++;
    }

    montarCalendario();
  });

  montarCalendario();
</script>
  
</body>
</html>
