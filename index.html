<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f2ec">
  <title>Primeira Dama</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f2ec;
      color: #332d2a;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      padding: 24px 18px 40px;
    }

    .topo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .marca {
      font-size: 14px;
      letter-spacing: 2px;
      font-weight: bold;
      color: #8c625b;
    }

    .perfil {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #e6d5cc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .saudacao {
      margin-bottom: 28px;
    }

    .saudacao small {
      color: #8a817c;
      font-size: 14px;
    }

    .saudacao h1 {
      margin: 5px 0 0;
      font-size: 29px;
      font-weight: 600;
    }

    .calendario {
      background: white;
      border-radius: 26px;
      padding: 22px 18px;
      box-shadow: 0 8px 30px rgba(70, 50, 40, 0.08);
    }

    .mes {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .mes button {
      border: 0;
      background: #f4ece7;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 20px;
      color: #5c4a44;
    }

    .mes h2 {
      margin: 0;
      font-size: 19px;
    }

    .semana,
    .dias {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 7px;
      text-align: center;
    }

    .semana {
      color: #9a8e88;
      font-size: 12px;
      margin-bottom: 9px;
    }

    .dia {
      aspect-ratio: 1;
      border: 0;
      background: transparent;
      border-radius: 50%;
      font-size: 14px;
      color: #403936;
      position: relative;
    }

    .dia:hover {
      background: #f4ece7;
    }

    .dia.hoje {
      background: #8c625b;
      color: white;
      font-weight: bold;
    }

    .dia.memoria::after {
      content: "";
      width: 5px;
      height: 5px;
      background: #c99983;
      border-radius: 50%;
      position: absolute;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);
    }

    .legenda {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 18px;
      color: #8a817c;
      font-size: 12px;
    }

    .bolinha {
      width: 7px;
      height: 7px;
      background: #c99983;
      border-radius: 50%;
    }

    .acoes {
      margin-top: 22px;
    }

    .nova-capsula {
      width: 100%;
      border: 0;
      border-radius: 18px;
      background: #5e4943;
      color: white;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
    }

    .frase {
      text-align: center;
      color: #91857f;
      font-size: 13px;
      line-height: 1.5;
      margin: 26px 20px 0;
    }
  /* TELA DE PRIMEIRO ACESSO */
.tela-cadastro {
  position: fixed;
  inset: 0;
  z-index: 10000;
  background: linear-gradient(160deg, #2b1528, #6b294f);
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px;
  text-align: center;
}

.tela-cadastro h1 {
  margin-bottom: 10px;
}

.tela-cadastro h2 {
  margin-bottom: 25px;
}

.tela-cadastro input {
  width: 100%;
  max-width: 320px;
  padding: 15px;
  margin: 10px 0 18px;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  outline: none;
}

.tela-cadastro button {
  width: 100%;
  max-width: 320px;
  padding: 15px;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
  </style>
</head>

<body>
  <!-- TELA DE PRIMEIRO ACESSO -->
<div id="telaCadastro" class="tela-cadastro">

  <h1>Primeira Dama ❤️</h1>
  <h2>Crie seu perfil</h2>

  <p>Como você quer ser chamado?</p>

  <input
    type="text"
    id="nomeUsuario"
    placeholder="Digite seu nome"
    maxlength="30"
  >

  <button id="continuarCadastro">
    Continuar
  </button>

</div>

  <main class="app">

    <header class="topo">
      <div class="marca">PRIMEIRA DAMA</div>
      <div class="perfil">♡</div>
    </header>

    <section class="saudacao">
      <small>Suas histórias vivem aqui</small>
      <h1>Memórias que ficam.</h1>
    </section>

    <section class="calendario">

      <div class="mes">
        <button aria-label="Mês anterior">‹</button>
        <h2>Setembro 2026</h2>
        <button aria-label="Próximo mês">›</button>
      </div>

      <div class="semana">
        <span>D</span>
        <span>S</span>
        <span>T</span>
        <span>Q</span>
        <span>Q</span>
        <span>S</span>
        <span>S</span>
      </div>

      <div class="dias">
        <span></span>
        <span></span>

        <button class="dia">1</button>
        <button class="dia">2</button>
        <button class="dia">3</button>
        <button class="dia">4</button>
        <button class="dia">5</button>

        <button class="dia">6</button>
        <button class="dia">7</button>
        <button class="dia memoria">8</button>
        <button class="dia">9</button>
        <button class="dia">10</button>
        <button class="dia memoria">11</button>
        <button class="dia">12</button>

        <button class="dia">13</button>
        <button class="dia">14</button>
        <button class="dia">15</button>
        <button class="dia">16</button>
        <button class="dia memoria">17</button>
        <button class="dia">18</button>
        <button class="dia">19</button>

        <button class="dia">20</button>
        <button class="dia">21</button>
        <button class="dia">22</button>
        <button class="dia">23</button>
        <button class="dia">24</button>
        <button class="dia hoje">25</button>
        <button class="dia">26</button>

        <button class="dia">27</button>
        <button class="dia">28</button>
        <button class="dia">29</button>
        <button class="dia">30</button>
      </div>

      <div class="legenda">
        <span class="bolinha"></span>
        <span>Este dia guarda uma memória</span>
      </div>

    </section>

    <div class="acoes">
      <button class="nova-capsula">＋ Criar nova cápsula</button>
    </div>

    <p class="frase">
      Fotos, vídeos, áudios e palavras.<br>
      Guarde hoje para reviver amanhã.
    </p>

  </main>

<script>
  
  const telaCadastro = document.getElementById("telaCadastro");
const nomeUsuario = document.getElementById("nomeUsuario");
const continuarCadastro = document.getElementById("continuarCadastro");

continuarCadastro.addEventListener("click", () => {
  const nome = nomeUsuario.value.trim();

  if (nome === "") {
    alert("Digite seu nome para continuar.");
    return;
  }

  localStorage.setItem("primeiraDamaNome", nome);

  telaCadastro.innerHTML = `
  <h1>Primeira Dama ❤️</h1>
  <h2>Crie seu ID</h2>

  <p>Esse será seu identificador único.</p>

  <input
    type="text"
    id="idUsuario"
    placeholder="Ex: daniel123"
    maxlength="20"
  >

  <button id="criarId">
    Criar meu ID
  </button>
`;
});
  document.addEventListener("click", (event) => {
  if (event.target.id !== "criarId") return;

  const campoId = document.getElementById("idUsuario");
  const id = campoId.value.trim().toLowerCase();

  if (id === "") {
    alert("Escolha um ID para continuar.");
    return;
  }

  localStorage.setItem("primeiraDamaId", id);

  alert("Seu ID @" + id + " foi criado! Agora vamos criar seu avatar.");
});
  const nomesMeses = [
    "Janeiro", "Fevereiro", "Março", "Abril",
    "Maio", "Junho", "Julho", "Agosto",
    "Setembro", "Outubro", "Novembro", "Dezembro"
  ];

  let mesAtual = 8;
  let anoAtual = 2026;

  const tituloMes = document.querySelector(".mes h2");
  const areaDias = document.querySelector(".dias");
  const botoesMes = document.querySelectorAll(".mes button");

  function montarCalendario() {
    tituloMes.textContent = `${nomesMeses[mesAtual]} ${anoAtual}`;
    areaDias.innerHTML = "";

    const primeiroDia = new Date(anoAtual, mesAtual, 1).getDay();
    const quantidadeDias = new Date(anoAtual, mesAtual + 1, 0).getDate();

    for (let i = 0; i < primeiroDia; i++) {
      const vazio = document.createElement("span");
      areaDias.appendChild(vazio);
    }

    for (let dia = 1; dia <= quantidadeDias; dia++) {
      const botao = document.createElement("button");
      botao.className = "dia";
      botao.textContent = dia;

      if (
        dia === 25 &&
        mesAtual === 8 &&
        anoAtual === 2026
      ) {
        botao.classList.add("hoje");
      }

      if (
        mesAtual === 8 &&
        anoAtual === 2026 &&
        [8, 11, 17].includes(dia)
      ) {
        botao.classList.add("memoria");
      }

      let tempoPressionado;
let toqueLongo = false;

function iniciarToqueLongo() {
  toqueLongo = false;

  tempoPressionado = setTimeout(() => {
    toqueLongo = true;

    botao.style.outline = "3px solid #c99983";
    botao.style.outlineOffset = "4px";

    if (navigator.vibrate) {
      navigator.vibrate(80);
    }

    const cachorroAntigo = document.querySelector(".cachorro-memoria");

if (cachorroAntigo) {
  cachorroAntigo.remove();
}

const cachorro = document.createElement("div");
cachorro.className = "cachorro-memoria";

cachorro.innerHTML = `
  <div class="cao-corpo">
    <div class="cao-rabo"></div>

    <div class="cao-tronco">
      <div class="cao-pata pata1"></div>
      <div class="cao-pata pata2"></div>
      <div class="cao-pata pata3"></div>
      <div class="cao-pata pata4"></div>
    </div>

    <div class="cao-cabeca">
      <div class="cao-orelha orelha1"></div>
      <div class="cao-orelha orelha2"></div>
      <div class="cao-olho olho1"></div>
      <div class="cao-olho olho2"></div>
      <div class="cao-focinho"></div>
    </div>

    <div class="mini-capsula">❤️</div>
  </div>

  <div class="fala-cao">Buscando sua memória... 🐾</div>
`;

const estiloCachorro = document.createElement("style");

estiloCachorro.textContent = `
  .cachorro-memoria {
    position: fixed;
    left: -150px;
    bottom: 105px;
    z-index: 9999;
    width: 130px;
    text-align: center;
    pointer-events: none;
  }

  .cao-corpo {
    width: 110px;
    height: 75px;
    position: relative;
    margin: auto;
  }

  .cao-tronco {
    position: absolute;
    width: 68px;
    height: 40px;
    background: #c98f62;
    border-radius: 50% 48% 42% 45%;
    left: 18px;
    top: 22px;
  }

  .cao-cabeca {
    position: absolute;
    width: 43px;
    height: 42px;
    background: #d69c6d;
    border-radius: 48% 48% 45% 45%;
    right: 0;
    top: 8px;
  }

  .cao-orelha {
    position: absolute;
    width: 15px;
    height: 27px;
    background: #8b5c42;
    border-radius: 60%;
    top: 3px;
  }

  .orelha1 {
    left: -4px;
    transform: rotate(22deg);
  }

  .orelha2 {
    right: -3px;
    transform: rotate(-20deg);
  }

  .cao-olho {
    position: absolute;
    width: 5px;
    height: 5px;
    background: #302522;
    border-radius: 50%;
    top: 17px;
  }

  .olho1 {
    left: 12px;
  }

  .olho2 {
    right: 12px;
  }

  .cao-focinho {
    position: absolute;
    width: 9px;
    height: 7px;
    background: #302522;
    border-radius: 50%;
    right: -2px;
    top: 25px;
  }

  .cao-pata {
    position: absolute;
    width: 9px;
    height: 27px;
    background: #b97850;
    border-radius: 8px;
    bottom: -17px;
    transform-origin: top center;
  }

  .pata1 { left: 9px; }
  .pata2 { left: 25px; }
  .pata3 { right: 22px; }
  .pata4 { right: 7px; }

  .cao-rabo {
    position: absolute;
    width: 34px;
    height: 10px;
    background: #b97850;
    border-radius: 10px;
    left: 2px;
    top: 25px;
    transform-origin: right center;
    transform: rotate(-30deg);
  }

  .mini-capsula {
    display: none;
    position: absolute;
    right: -20px;
    top: 35px;
    width: 32px;
    height: 23px;
    background: #f5e3dc;
    border: 2px solid #9b7569;
    border-radius: 6px;
    font-size: 13px;
    line-height: 19px;
  }

  .fala-cao {
    margin-top: 14px;
    background: white;
    color: #5e4943;
    padding: 9px 12px;
    border-radius: 17px;
    box-shadow: 0 6px 18px rgba(0,0,0,.12);
    font-size: 13px;
    white-space: nowrap;
  }

  .cachorro-memoria.andando .cao-pata {
    animation: andarPata .22s infinite alternate;
  }

  .cachorro-memoria.andando .pata2,
  .cachorro-memoria.andando .pata4 {
    animation-delay: .22s;
  }

  .cachorro-memoria.andando .cao-rabo {
    animation: abanarRabo .18s infinite alternate;
  }

  @keyframes andarPata {
    from { transform: rotate(24deg); }
    to   { transform: rotate(-24deg); }
  }

  @keyframes abanarRabo {
    from { transform: rotate(-48deg); }
    to   { transform: rotate(5deg); }
  }
`;

document.head.appendChild(estiloCachorro);
document.body.appendChild(cachorro);

cachorro.classList.add("andando");

const alvo = botao.getBoundingClientRect();
const cao = cachorro.getBoundingClientRect();

const destinoX = alvo.left - cao.width + (alvo.width / 2);
const destinoY = alvo.top - cao.height + (alvo.height / 2);

cachorro.animate(
  [
    {
      left: "-150px",
      top: `${cao.top}px`,
      transform: "scaleX(1)"
    },
    {
      left: `${destinoX}px`,
      top: `${destinoY}px`,
      transform: "scaleX(1)"
    }
  ],
  {
    duration: 1400,
    easing: "ease-in-out",
    fill: "forwards"
  }
);

setTimeout(() => {
  const dataSelecionada = botao.cloneNode(true);

  dataSelecionada.style.position = "absolute";
  dataSelecionada.style.left = "88px";
  dataSelecionada.style.top = "28px";
  dataSelecionada.style.width = "32px";
  dataSelecionada.style.height = "32px";
  dataSelecionada.style.borderRadius = "50%";
  dataSelecionada.style.zIndex = "10";
  dataSelecionada.style.pointerEvents = "none";

  cachorro.appendChild(dataSelecionada);

  cachorro.querySelector(".fala-cao").textContent =
    "Achei! Vou levar para você. ❤️";

  cachorro.animate(
    [
      {
        left: `${destinoX}px`,
        top: `${destinoY}px`,
        transform: "scaleX(-1)"
      },
      {
        left: "calc(50% - 55px)",
        top: "calc(50% - 55px)",
        transform: "scaleX(-1)"
      }
    ],
    {
      duration: 1200,
      easing: "ease-in-out",
      fill: "forwards"
    }
  );
}, 1450);

setTimeout(() => {
  cachorro.remove();

  const capsulaAntiga = document.querySelector(".capsula-memoria");

  if (capsulaAntiga) {
    capsulaAntiga.remove();
  }

  const capsula = document.createElement("div");
  capsula.className = "capsula-memoria";

  capsula.innerHTML = `
    <div style="
      background:white;
      width:calc(100% - 32px);
      max-width:430px;
      margin:auto;
      border-radius:28px 28px 0 0;
      padding:24px 20px 30px;
      box-shadow:0 -8px 30px rgba(0,0,0,.15);
    ">

      <div style="
        width:42px;
        height:5px;
        border-radius:10px;
        background:#ddd2cc;
        margin:0 auto 20px;
      "></div>

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:12px;
      ">
        <div>
          <div style="
            color:#9b7569;
            font-size:12px;
            letter-spacing:1.5px;
            font-weight:bold;
          ">
            SUA CÁPSULA
          </div>

          <h2 style="
            margin:5px 0 0;
            color:#332d2a;
            font-size:23px;
          ">
            ${dia} de ${nomesMeses[mesAtual]} de ${anoAtual}
          </h2>
        </div>

        <button class="fechar-capsula" style="
          border:0;
          background:#f4ece7;
          width:42px;
          height:42px;
          border-radius:50%;
          font-size:22px;
          color:#5e4943;
        ">×</button>
      </div>

      <p style="
        color:#8a817c;
        line-height:1.5;
        margin:18px 0 20px;
      ">
        Uma memória especial ficou guardada neste dia.
      </p>

      <div style="
        display:flex;
        gap:14px;
        align-items:center;
        margin-bottom:18px;
      ">

        <div style="
          width:76px;
          height:76px;
          min-width:76px;
          border-radius:50%;
          background:#eadbd3;
          display:flex;
          align-items:center;
          justify-content:center;
          font-size:30px;
        ">📷</div>

        <div style="
          background:#f4ece7;
          border-radius:18px;
          padding:15px 18px;
          flex:1;
          color:#5e4943;
        ">
          🎙️ Áudio da memória
        </div>

      </div>

      <div style="
        display:flex;
        gap:12px;
        margin-bottom:20px;
      ">

        <div style="
          width:88px;
          height:88px;
          border-radius:18px;
          background:#e6d5cc;
          display:flex;
          align-items:center;
          justify-content:center;
          font-size:30px;
        ">▶️</div>

        <div style="
          flex:1;
          background:#faf6f3;
          border-radius:18px;
          padding:16px;
          color:#6d5b54;
          line-height:1.4;
        ">
          “Alguns momentos merecem ficar para sempre.”
        </div>

      </div>

      <button style="
        width:100%;
        border:0;
        border-radius:17px;
        padding:15px;
        background:#5e4943;
        color:white;
        font-size:15px;
        font-weight:bold;
        margin-bottom:10px;
      ">
        ♡ Reviver este dia
      </button>

      <button style="
        width:100%;
        border:1px solid #ded1ca;
        border-radius:17px;
        padding:15px;
        background:white;
        color:#5e4943;
        font-size:15px;
        font-weight:bold;
      ">
        🔒 Abrir no futuro
      </button>

    </div>
  `;

  capsula.style.position = "fixed";
  capsula.style.left = "0";
  capsula.style.right = "0";
  capsula.style.bottom = "0";
  capsula.style.zIndex = "9998";

  document.body.appendChild(capsula);

  capsula.querySelector(".fechar-capsula").addEventListener("click", () => {
    capsula.remove();
  });

}, 3000);
  }, 700);
}

function cancelarToqueLongo() {
  clearTimeout(tempoPressionado);
}

botao.addEventListener("pointerdown", iniciarToqueLongo);
botao.addEventListener("pointerup", cancelarToqueLongo);
botao.addEventListener("pointerleave", cancelarToqueLongo);
botao.addEventListener("pointercancel", cancelarToqueLongo);

      areaDias.appendChild(botao);
    }
  }

  botoesMes[0].addEventListener("click", () => {
    mesAtual--;

    if (mesAtual < 0) {
      mesAtual = 11;
      anoAtual--;
    }

    montarCalendario();
  });

  botoesMes[1].addEventListener("click", () => {
    mesAtual++;

    if (mesAtual > 11) {
      mesAtual = 0;
      anoAtual++;
    }

    montarCalendario();
  });

  montarCalendario();
</script>
  
</body>
</html>
