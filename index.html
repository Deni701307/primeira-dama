    .topo {

      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .marca {
      font-size: 14px;
      letter-spacing: 2px;
      font-weight: bold;
      color: #8c625b;
    }

    .perfil {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #e6d5cc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .saudacao {
      margin-bottom: 28px;
    }

    .saudacao small {
      color: #8a817c;
      font-size: 14px;
    }

    .saudacao h1 {
      margin: 5px 0 0;
      font-size: 29px;
      font-weight: 600;
    }

    .calendario {
      background: white;
      border-radius: 26px;
      padding: 22px 18px;
      box-shadow: 0 8px 30px rgba(70, 50, 40, 0.08);
    user-select: none;
-webkit-user-select: none;
-webkit-touch-callout: none;}
    .mes {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .mes button {
      border: 0;
      background: #f4ece7;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 20px;
      color: #5c4a44;
    }

    .mes h2 {
      margin: 0;
      font-size: 19px;
    }

    .semana,
    .dias {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 7px;
      text-align: center;
    }

    .semana {
      color: #9a8e88;
      font-size: 12px;
      margin-bottom: 9px;
    }

    .dia {
      aspect-ratio: 1;
      border: 0;
      background: transparent;
      border-radius: 50%;
      font-size: 14px;
      color: #403936;
      position: relative;
    }

    .dia:hover {
      background: #f4ece7;
    }

    .dia.hoje {
      background: #8c625b;
      color: white;
      font-weight: bold;
    }

    .dia.memoria::after {
      content: "";
      width: 5px;
      height: 5px;
      background: #c99983;
      border-radius: 50%;
      position: absolute;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);

    .legenda {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 18px;
      color: #8a817c;
      font-size: 12px;
    }

    .bolinha {

      height: 7px;
      background: #c99983;
      border-radius: 50%;

    .acoes {

    .nova-capsula {

      font-weight: bold;

  text-align: center;

.compartilhar p {

  font-size: 16px;
  outline: none;

.tela-cadastro button {
  width: 100%;
  max-width: 320px;
  padding: 15px;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;

</head>

    telaCadastro.style.display = "none";

    alert("Digite seu nome para continuar.");
    return;
  }

    Criar meu ID
  </button>

});

    botao.style.outline = "none";

  function montarCalendario() {
    tituloMes.textContent = `${nomesMeses[mesAtual]} ${anoAtual}`;
    areaDias.innerHTML = "";

    const primeiroDia = new Date(anoAtual, mesAtual, 1).getDay();
    const quantidadeDias = new Date(anoAtual, mesAtual + 1, 0).getDate();

    for (let i = 0; i < primeiroDia; i++) {
      const vazio = document.createElement("span");
      areaDias.appendChild(vazio);
    }

    for (let dia = 1; dia <= quantidadeDias; dia++) {
      const botao = document.createElement("button");
      botao.className = "dia";
      botao.textContent = dia;

      if (
        dia === 25 &&
        mesAtual === 8 &&
        anoAtual === 2026
      ) {
        botao.classList.add("hoje");
      }

      if (
        mesAtual === 8 &&
        anoAtual === 2026 &&
        [8, 11, 17].includes(dia)
      ) {
        botao.classList.add("memoria");
      }

botaoConvidar.addEventListener("click", () => {
  const meuId = localStorage.getItem("primeiraDamaId");

  if (!meuId) {
    alert("Crie seu ID primeiro.");
    return;
  }

  const linkConvite =
    window.location.origin +
    window.location.pathname +
    "?convite=" +
    encodeURIComponent(meuId);

  if (navigator.share) {
    navigator.share({
      title: "Primeira Dama ❤️",
      text: "Quero dividir minhas memórias com você. Entre no Primeira Dama ❤️",
      url: linkConvite
    });
  } else {
    navigator.clipboard.writeText(linkConvite);
    alert("Link do convite copiado!");
  }
});
